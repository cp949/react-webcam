name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from package changelog
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          changelog_path="packages/react-webcam/CHANGELOG.md"
          notes_file="$(mktemp)"

          awk -v version="$version" '
            $0 ~ "^## \\[?v?" version "\\]?([[:space:]]|$|\\()" { in_section=1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' "$changelog_path" | sed '/./,$!d' > "$notes_file"

          missing=false
          if [ ! -s "$notes_file" ]; then
            missing=true
            echo "::error title=릴리스 노트 섹션 없음::${changelog_path}에서 ${version} 섹션을 찾지 못했다."
            {
              echo "Release ${tag}"
              echo
              echo "No matching section was found in ${changelog_path}."
            } > "$notes_file"
          fi

          {
            echo "missing=${missing}"
            echo "body<<EOF"
            cat "$notes_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

      # 릴리스는 대체 본문으로 만들고, 노트가 비었다는 사실은 실패 알림으로 드러낸다.
      - name: Fail when release notes are missing
        if: steps.notes.outputs.missing == 'true'
        run: exit 1

  # 게시 직후 레지스트리에서 설치한 결과를 소비자 관점으로 검증한다.
  # 레지스트리 전파 지연에 대비해 설치를 30초 간격으로 5회까지 재시도한다.
  verify-registry-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the published package installs and type-checks
        run: node packages/react-webcam/scripts/verify-registry-install.mjs "${GITHUB_REF_NAME#v}"

      - name: Open an issue when verification fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "릴리스 ${GITHUB_REF_NAME} 레지스트리 설치 검증 실패" \
            --body "태그 ${GITHUB_REF_NAME}를 게시한 뒤 레지스트리 설치 검증이 실패했다. 실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
